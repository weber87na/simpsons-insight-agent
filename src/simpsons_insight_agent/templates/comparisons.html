<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>品牌／議題比較</title><link rel="stylesheet" href="/static/app.css"><link rel="stylesheet" href="/static/insights.css"></head>
<body><main class="shell"><nav class="top-nav"><a href="/">← 返回任務</a></nav><section class="panel"><h1>品牌／議題比較</h1><p>選擇自家品牌與競爭品牌報告，使用相同查詢期間。樣本量不代表市場占有率。</p>
<div class="actions"><button type="button" id="comparison-new" class="secondary">新增品牌比較</button><button type="button" id="comparison-retry" class="secondary">重試讀取比較</button></div>
<form id="compare-form"><label>比較名稱<input id="comparison-name" required maxlength="200" value="品牌標竿比較"></label><label>報告（選取 2–5 個不同品牌）<select id="comparison-reports" multiple required size="7" aria-label="品牌報告"></select></label>
<div class="filter-grid"><label>情緒<select id="comparison-sentiment"><option value="">全部</option><option value="positive">正面</option><option value="neutral">中立</option><option value="negative">負面</option><option value="rating_only">僅星等</option><option value="unknown">未知</option></select></label><label>內容類型<select id="comparison-type"><option value="">全部</option><option value="review">評論</option><option value="post">主文</option><option value="comment">回應</option></select></label><label>面向<select id="comparison-aspect"><option value="">全部</option><option value="service">服務</option><option value="speed_wait">等候</option><option value="price_value">價格</option><option value="product_quality">品質</option><option value="environment">環境</option><option value="other">其他</option></select></label><label>文字<input id="comparison-q" maxlength="500"></label></div>
<div class="filter-grid"><label>起始日<input type="date" id="comparison-from" required></label><label>結束日<input type="date" id="comparison-to" required></label><label>來源<select id="comparison-source"><option value="">全部來源</option><option value="google_maps">Google Maps</option><option value="ptt">PTT</option><option value="dcard">Dcard</option></select></label><label>粒度<select id="comparison-interval"><option value="month">每月</option><option value="week">每週</option><option value="day">每日</option></select></label><button class="primary" id="comparison-submit">建立比較</button></div></form><p id="comparison-error" class="error" role="alert"></p></section>
<section id="comparison-results" class="panel" hidden></section></main><script src="/static/report-components.js" defer></script><script src="/static/comparison-workspace.js" defer></script></body></html>
