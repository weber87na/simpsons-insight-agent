[project]
name = "simpsons-insight-agent"
version = "0.2.0"
description = "Simpsons Insight Agent for local Google Maps, PTT, and Dcard cross-platform reputation analysis"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "fastapi>=0.116",
    "httpx>=0.28",
    "jinja2>=3.1",
    "lingua-language-detector>=2.1",
    "numpy>=2.1",
    "openai>=1.100",
    "orjson>=3.10",
    "playwright>=1.54",
    "pydantic-settings>=2.10",
    "python-multipart>=0.0.20",
    "sentence-transformers>=5.0",
    "sqlalchemy>=2.0",
    "tenacity>=9.1",
    "torch>=2.7",
    "transformers>=4.54",
    "uvicorn[standard]>=0.35",
]

[dependency-groups]
dev = [
    "mypy>=1.17",
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "pytest-playwright>=0.7",
    "respx>=0.22",
    "ruff>=0.12",
]

[project.scripts]
simpsons-insight-agent = "simpsons_insight_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simpsons_insight_agent"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["data", ".venv", ".pytest_cache", ".mypy_cache", ".ruff_cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
check_untyped_defs = true
follow_imports = "skip"
ignore_missing_imports = true
